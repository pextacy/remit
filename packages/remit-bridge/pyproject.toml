[project]
name = "remit-bridge"
version = "0.0.0"
description = "Remit bridge — Almanak execution seam, KeeperHub client, provenance receipts"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned exactly: the adapter is written against the installed source of this
    # version, read under .venv, not against a remembered API (CLAUDE.md §8).
    "almanak==2.28.0",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
remit = "remit_bridge.cli:main"

[dependency-groups]
dev = ["ruff==0.15.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remit_bridge"]

[tool.ruff]
target-version = "py312"
line-length = 90
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "RET", "SIM", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place that is allowed to print to an operator.
"src/remit_bridge/cli.py" = ["T20"]
# N818 wants every exception to end in "Error". These names are fixed by the spec —
# PRD.md KH-4 says the ambiguity case raises `ReceiptUnresolvable` — and matching the
# document a reviewer is reading is worth more than the suffix convention.
"src/remit_bridge/errors.py" = ["N818"]
