name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present type-check
      - run: pnpm lint
      # `test` is a no-op until P2 lands the first suite (PLAN.md 1.6). It stays
      # in the pipeline so the suite runs from the commit that introduces it.
      - run: pnpm -r --if-present test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/remit-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The bridge calls the TypeScript core across a process boundary. If that call
      # breaks, every gate the bridge runs is skipped rather than failed, so the wiring
      # is checked on every push.
      - run: uv run remit --help

  # The four gates are the product. Type-checking them proves they compile; this proves
  # they refuse. Without it a regression in G1, G2, G4 or the receipt chain lands green,
  # and the first thing anybody would notice is a demo behaving differently to the README.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remit/core build
      - run: uv sync --all-groups --directory packages/remit-bridge

      # Real contracts, real state, nobody's money. A fork is the only acceptable
      # substitute for the chain (CLAUDE.md §2.1), and it is the one CI can afford.
      - name: Fork Base Sepolia
        run: |
          anvil --fork-url https://sepolia.base.org --port 8546 --silent &
          for i in $(seq 1 60); do
            cast block-number --rpc-url http://127.0.0.1:8546 >/dev/null 2>&1 && break
            sleep 1
          done
          cast chain-id --rpc-url http://127.0.0.1:8546

      - name: The addresses still exist on chain
        run: pnpm --filter @remit/core verify:constants

      - name: P1 — value leaves a Safe through Roles, and refusals have names
        run: pnpm --filter ops p1 --network anvil
        env: { ANVIL_RPC_URL: http://127.0.0.1:8546 }

      - name: Issue and sign a Remit
        run: |
          pnpm --filter ops remit:issue --network anvil \
            --strategy strategies/remit_usdc_lender/strategy.py \
            --workflow ops/workflows/exec-with-role.workflow.json
          pnpm --filter ops remit:verify-digest --network anvil
          pnpm --filter ops remit:sign --network anvil
        env: { ANVIL_RPC_URL: http://127.0.0.1:8546 }

      - name: G1 refuses what it claims to
        run: pnpm --filter ops g1 --network anvil
        env: { ANVIL_RPC_URL: http://127.0.0.1:8546 }

      - name: The chain says what the preset says
        run: pnpm --filter ops roles:diff --network anvil
        env: { ANVIL_RPC_URL: http://127.0.0.1:8546 }

      - name: Every non-happy path, with a receipt for each
        run: |
          pnpm --filter ops fund --network anvil --usdc 100
          rm -rf receipts/anvil
          pnpm --filter ops nh --network anvil
        env: { ANVIL_RPC_URL: http://127.0.0.1:8546 }

      - name: The receipt chain verifies, from Python through the core
        run: uv run --directory packages/remit-bridge remit verify --network anvil
        env: { ANVIL_RPC_URL: http://127.0.0.1:8546 }

      - name: A strategy's intent crosses Almanak's seam into the gates
        run: |
          uv run --directory packages/remit-bridge remit serve \
            --network anvil --port 50051 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "listening" /tmp/serve.log && break
            sleep 1
          done
          cat /tmp/serve.log
          uv run --directory packages/remit-bridge python -m remit_bridge.drive \
            --network anvil --port 50051 --dry-run
          # The refusals matter as much as the happy path.
          for case in protocol amount chained recipient; do
            uv run --directory packages/remit-bridge python -m remit_bridge.drive \
              --network anvil --port 50051 --dry-run --rogue "$case" && exit 1
          done
          echo "every rogue intent was refused"
        env: { ANVIL_RPC_URL: http://127.0.0.1:8546 }

  calldata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # CLAUDE.md §2.3 is the thesis of the project, so it is enforced mechanically
      # rather than by review. An intent carries a kind, an asset symbol, a decimal
      # amount and one counterparty address. The moment it can carry bytes, a selector
      # or a target, model output reaches calldata and every gate downstream is theatre.
      - name: An intent cannot carry calldata
        run: |
          set -u
          # `to` is deliberately absent from this list: on a withdraw it names a
          # recipient, which G1 checks against allowedRecipients. The danger is a field
          # that names *what to call* or *what bytes to send*.
          if grep -nE '\b(data|calldata|abi|selector|signature|target|bytecode|payload)\s*:' \
               packages/remit-core/src/schema/intent.ts; then
            echo "::error::intent schema gained a field that can carry calldata"; exit 1
          fi
          # No free-form strings either: every field is one of the checked primitives,
          # so there is nowhere for an unvalidated value to sit.
          if grep -nE 'z\.(string|any|unknown|record)\(' \
               packages/remit-core/src/schema/intent.ts; then
            echo "::error::intent schema gained an unconstrained field"; exit 1
          fi
          # Calldata built from an *intent* happens in exactly one module, from ABIs
          # verified on chain. `src/roles/encode.ts` also encodes calls — the owner
          # transactions that apply a preset — but it never sees an intent, and the
          # check below keeps it that way.
          builders=$(grep -rl 'encodeFunctionData' packages/remit-core/src \
            | grep -v 'src/compile/' | grep -v 'src/roles/encode.ts' || true)
          if [ -n "$builders" ]; then
            echo "::error::calldata is built outside src/compile: $builders"; exit 1
          fi
          if grep -rn "schema/intent" packages/remit-core/src/roles/; then
            echo "::error::the preset encoder gained a path from an intent to calldata"; exit 1
          fi
          echo "clean"

  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Acceptance criterion 3: the committed chain verifies from a clean clone, with no
      # access to our infrastructure. If it ever stops doing that, the provenance claim
      # is void and we should hear about it from CI rather than from a judge.
      - name: Committed receipt chains verify
        run: |
          set -eu
          found=0
          for dir in receipts/*/; do
            ls "$dir"0000-*.json >/dev/null 2>&1 || continue
            found=1
            echo "verifying $dir"
            # Absolute: a filtered pnpm script runs from the package directory, and a
            # relative path that resolved to nothing used to verify an empty chain and
            # pass. The CLI now refuses a missing directory; the path is absolute anyway.
            echo "{\"dir\":\"$PWD/$dir\"}" | pnpm --silent --filter @remit/core cli receipt:verify
          done
          [ "$found" -eq 1 ] || echo "no committed chains yet — nothing to verify"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A committed key invalidates the submission (CLAUDE.md §2.4), and finding
      # it on Friday morning is too late. Cheap, so it runs on every push.
      - name: No .env, no key material in the tree
        run: |
          set -u
          fail() { echo "::error::$1"; exit 1; }

          git ls-files --error-unmatch .env >/dev/null 2>&1 \
            && fail ".env is tracked"

          git grep -nIE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            && fail "PEM private key in the tree"

          # A bare 32-byte hex string is not enough to go on: a roleKey, a
          # limitsHash and a private key are the same shape. Flag it only when
          # the line also names a secret.
          git grep -nIE \
            -e '(PRIVATE_KEY|MNEMONIC|SEED_PHRASE|API_KEY|SECRET|TOKEN)[A-Z_]*["'"'"']?\s*[:=]\s*["'"'"']?(0x)?[A-Za-z0-9_/+-]{16}' \
            -- . ':!.env.example' ':!docs' ':!*.lock' ':!pnpm-lock.yaml' \
            && fail "possible credential assigned in the tree"

          echo "clean"
